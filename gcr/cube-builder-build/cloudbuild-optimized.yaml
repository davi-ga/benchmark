substitutions:
  _SERVICE_NAME: cube-builder-optimized
  _REGION: us-central1

steps:
  # O forge roda AQUI, em tempo de build. O "optimized/" não existe no repo.
  # python:3.12 (não-slim) já traz git; as deps de runtime (pytest, numba)
  # vêm do extra [build] do pyproject.
  - name: "python:3.12"
    id: run-forge
    entrypoint: bash
    args:
      - "-c"
      - |
        set -e
        pip install --no-cache-dir "forge[build] @ git+https://github.com/davi-ga/numba-build.git"
        forge --source-dir functions --output-dir optimized
    secretEnv:
      - GEMINI_API_KEY
      - MODULARIZE_PROMPT
      - TEST_PROMPT

  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - "build"
      - "-f"
      - "Dockerfile.optimized"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "."
    waitFor:
      - run-forge

  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
    waitFor:
      - docker-build

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "--region"
      - "$_REGION"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      - "--set-env-vars"
      - "VERSION=optimized"
    waitFor:
      - docker-push

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY
    - versionName: projects/$PROJECT_ID/secrets/MODULARIZE_PROMPT/versions/latest
      env: MODULARIZE_PROMPT
    - versionName: projects/$PROJECT_ID/secrets/TEST_PROMPT/versions/latest
      env: TEST_PROMPT

images:
  - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
