steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/yuki-mt-full-test-optimized', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/yuki-mt-full-test-optimized']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy',
      'yuki-mt-full-test-optimized',
      '--image', 'gcr.io/$PROJECT_ID/yuki-mt-full-test-optimized',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--memory', '512Mi',
      '--cpu', '1',
      '--min-instances', '1',
      '--max-instances', '10',
      '--set-secrets', 'GEMINI_API_KEY=GEMINI_API_KEY:latest',
      '--set-env-vars', 'PYTHON_VERSION=3.12'
    ]
images:
  - 'gcr.io/$PROJECT_ID/yuki-mt-full-test-optimized'
