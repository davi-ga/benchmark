substitutions:
  _SERVICE_NAME: img2palette-optimized
  _REGION: us-central1

steps:
  - name: "gcr.io/cloud-builders/docker"
    id: docker-build
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: docker-push
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
    waitFor:
      - docker-build

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "$_SERVICE_NAME"
      - "--image"
      - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"
      - "--region"
      - "$_REGION"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
    waitFor:
      - docker-push

images:
  - "gcr.io/$PROJECT_ID/$_SERVICE_NAME:latest"

options:
  logging: CLOUD_LOGGING_ONLY
